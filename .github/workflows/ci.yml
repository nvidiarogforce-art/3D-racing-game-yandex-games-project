name: Build and gameplay checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run package:yandex
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-build-and-browser-results
          path: |
            artifacts/
            test-results/
          retention-days: 14
